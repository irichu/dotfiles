name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build and publish verified release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and repository
        run: |
          bash -n install.sh assets/scripts/main.sh assets/scripts/lib/*.sh
          test "$(cat assets/txt/version.txt)" = "${GITHUB_REF_NAME#v}"

      - name: Build archives and checksums
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          git archive --format=tar.gz --prefix=dotfiles/ \
            --output="artifacts/dotfiles-${version}.tar.gz" "$GITHUB_REF_NAME"
          git archive --format=zip --prefix=dotfiles/ \
            --output="artifacts/dotfiles-${version}.zip" "$GITHUB_REF_NAME"
          cd artifacts
          sha256sum "dotfiles-${version}.tar.gz" "dotfiles-${version}.zip" > SHA256SUMS

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cd artifacts
          sha256sum --check SHA256SUMS
          mkdir extracted
          tar -xzf "dotfiles-${version}.tar.gz" -C extracted
          test -x extracted/dotfiles/install.sh
          test "$(cat extracted/dotfiles/assets/txt/version.txt)" = "$version"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes --verify-tag
